<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Product Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="sneaker">
                <div class="circle"></div>
                <img src="https://raw.githubusercontent.com/developedbyed/3d-card-effect/master/adidas.png" alt="Sneaker">
            </div>
            <div class="info">
                <h1 class="title">Adidas ZX</h1>
                <h3 class="subtitle">FUTURECRAFT</h3>
                <div class="sizes">
                    <button class="active">39</button>
                    <button>40</button>
                    <button>42</button>
                    <button>44</button>
                </div>
                <div class="purchase">
                    <button>Purchase</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
